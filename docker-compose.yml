services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: miyko
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      API_ROLE_PASSWORD: ${API_ROLE_PASSWORD:?API_ROLE_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - miyko_postgres_data:/var/lib/postgresql/data
      - ./packages/database/docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d miyko"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  miyko_postgres_data:
